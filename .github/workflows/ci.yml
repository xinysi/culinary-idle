# 持续集成：push main / PR → 模拟套件 + 构建 + e2e（9 项）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Simulation suites
        run: |
          node scripts/system_test.mjs
          node scripts/season_check.mjs
          node scripts/system_test2.mjs
          node scripts/buff_test.mjs
          node scripts/continuity_test.mjs
          node scripts/audit_sync.mjs
          node scripts/content_sync_audit.mjs
          node scripts/item_triple_audit.mjs
          node scripts/minigame_ui_audit.mjs

      - name: Web build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install & browser
        run: |
          npm ci
          # runner 自带的 Google Chrome apt 源（dl.google.com）与镜像不同步，会让 apt-get update
          # 报 Hash Sum mismatch（2026-09-10 连续 3 次复现）→ 先移除该源；Playwright 自带 Chromium 不需要它
          sudo rm -f /etc/apt/sources.list.d/google*
          # 仍保留重试：apt 镜像偶发失败时再试两次
          npx playwright install --with-deps chromium ||
            (echo '首次安装失败，15s 后重试…' && sleep 15 && npx playwright install --with-deps chromium) ||
            (echo '二次失败，30s 后再试…' && sleep 30 && npx playwright install --with-deps chromium)

      - name: E2E（9 项流程 + 深色配色体检）
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 >/dev/null && break
            sleep 2
          done
          npx playwright test e2e-test.spec.mjs
          npx playwright test e2e-dark.spec.mjs
