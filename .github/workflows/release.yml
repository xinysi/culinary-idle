# 自动发布：推送 v* 标签 → 构建 → 桌面版打包 → 创建 GitHub Release 并上传
# 用法：git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 1. Web 构建
      - name: Install web deps & build
        run: |
          npm ci
          npm run build

      # 2. 桌面壳：安装 electron 依赖 + 复制构建产物 + 修正相对路径
      - name: Package desktop app
        working-directory: lmewexe
        run: |
          npm ci
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item ..\dist\* dist -Recurse -Force
          python fix_paths.py
          npx electron-packager . "美食放置：食灵山海" --platform=win32 --arch=x64 --out=release --overwrite --asar

      # 2.5 打包产物自检（2026-09-17 立）：asar 内的图片数必须与 dist 一致。
      #     背景：用户报「exe 打开后很多图片不显示」——查明**不是打包丢文件**（asar 内图片齐全），
      #     而是代码里写了根绝对路径 `/images/…`：打包后页面是 file:///…/dist/index.html，
      #     `/images/…` 会解析到**磁盘根**（file:///D:/images/…）→ 素材全 404。
      #     代码侧由 CI 的 `scripts/ci/image_path_audit.mjs` 守；这一步把「打包确实没漏文件」也钉死。
      #     ⚠️ 校验走 Node 脚本而不是 `asar list` CLI：release 目录名含中文，PowerShell 5.1 会把
      #        中文参数按 ANSI 读成乱码 → CLI 拿到错路径（实测踩过）。
      - name: Verify packaged assets
        working-directory: lmewexe
        run: node verify_asar.cjs

      # 3. 压缩 exe 目录为 zip
      #    注意：GitHub 附件名会剥掉非 ASCII 字符（中文会被整段丢弃，曾出现 "-win32-x64.zip"），
      #    所以 zip 用 ASCII 文件名上传，中文名改放到 release 资产的 display label 里。
      - name: Zip release
        working-directory: lmewexe
        run: |
          $zip = "culinary-idle-$env:GITHUB_REF_NAME-win32-x64.zip"
          if (Test-Path "release\$zip") { Remove-Item "release\$zip" -Force }
          Compress-Archive -Path "release\美食放置：食灵山海-win32-x64" -DestinationPath "release\$zip" -Force

      # 4. 创建 Release 并上传资产（zip 文件；v0.1.0 教训：只能传文件，不能传目录）
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip_file=$(ls lmewexe/release/culinary-idle-*-win32-x64.zip | head -1)
          echo "asset: $zip_file"
          gh release create "${GITHUB_REF_NAME}" "${zip_file}#美食放置：食灵山海 ${GITHUB_REF_NAME} 桌面版" \
            --title "${GITHUB_REF_NAME} — 美食放置：食灵山海" \
            --generate-notes \
            --notes "自动构建（GitHub Actions）。解压后运行 美食放置：食灵山海.exe 即可游玩。源码与开发说明见仓库根目录。"
