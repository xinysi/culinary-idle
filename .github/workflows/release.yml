# 自动发布：推送 v* 标签 → 构建 → 桌面版打包 → 创建 GitHub Release 并上传
# 用法：git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 1. Web 构建
      - name: Install web deps & build
        run: |
          npm ci
          npm run build

      # 2. 桌面壳：安装 electron 依赖 + 复制构建产物 + 修正相对路径
      - name: Package desktop app
        working-directory: lmewexe
        run: |
          npm ci
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item ..\dist\* dist -Recurse -Force
          python fix_paths.py
          npx electron-packager . "美食放置：食之契约" --platform=win32 --arch=x64 --out=release --overwrite --asar

      # 3. 压缩 exe 目录为 zip
      #    注意：GitHub 附件名会剥掉非 ASCII 字符（中文会被整段丢弃，曾出现 "-win32-x64.zip"），
      #    所以 zip 用 ASCII 文件名上传，中文名改放到 release 资产的 display label 里。
      - name: Zip release
        working-directory: lmewexe
        run: |
          $zip = "culinary-idle-$env:GITHUB_REF_NAME-win32-x64.zip"
          if (Test-Path "release\$zip") { Remove-Item "release\$zip" -Force }
          Compress-Archive -Path "release\美食放置：食之契约-win32-x64" -DestinationPath "release\$zip" -Force

      # 4. 创建 Release 并上传资产（zip 文件；v0.1.0 教训：只能传文件，不能传目录）
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip_file=$(ls lmewexe/release/culinary-idle-*-win32-x64.zip | head -1)
          echo "asset: $zip_file"
          gh release create "${GITHUB_REF_NAME}" "${zip_file}#美食放置：食之契约 ${GITHUB_REF_NAME} 桌面版" \
            --title "${GITHUB_REF_NAME} — 美食放置：食之契约" \
            --generate-notes \
            --notes "自动构建（GitHub Actions）。解压后运行 美食放置：食之契约.exe 即可游玩。源码与开发说明见仓库根目录。"
